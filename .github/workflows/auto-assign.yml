name: Auto assign

# pull_request_target is safe here: this workflow never checks out or executes
# code from the pull request — it only runs a fixed github-script step that
# adds a hardcoded assignee via the API.
on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Add assignee
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const assignees = ['zhukeev'];
            const issue_number = context.payload.pull_request
              ? context.payload.pull_request.number
              : context.issue.number;
            const { owner, repo } = context.repo;

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number,
              assignees,
            });
